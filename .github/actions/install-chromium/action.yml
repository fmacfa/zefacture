name: Installer Chromium avec Playwright
description: Installe Chromium et ses dépendances système sur Ubuntu 24.04.

inputs:
  working-directory:
    description: Répertoire du projet Playwright dont les dépendances sont installées.
    default: '.'

runs:
  using: composite
  steps:
    - name: Installer Chromium depuis les dépendances verrouillées
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        UBUNTU_MIRROR_SCRIPT: ${{ github.action_path }}/with-ubuntu-mirror.sh
      run: bash "$UBUNTU_MIRROR_SCRIPT" npx playwright install --with-deps chromium
