name: CI ZeFacture

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common:
    name: Contrôles communs
    uses: ./.github/workflows/ci-common.yml

  quality:
    name: Code et dépendances
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            .github/requirements-ci.txt
            django/tools/mcp-requirements.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - name: Erreurs Python
        run: ruff check django/core django/config django/tests django/tools --select E9,F821
      - name: Vulnérabilités des dépendances verrouillées
        run: |
          pip-audit -r django/requirements.txt --strict --no-deps --disable-pip --progress-spinner off
          pip-audit -r django/tools/mcp-requirements.txt --strict --no-deps --disable-pip --progress-spinner off
      - name: Connecteur MCP sur données fictives
        run: |
          python -m venv "$RUNNER_TEMP/zefacture-mcp"
          "$RUNNER_TEMP/zefacture-mcp/bin/python" -m pip install -r django/tools/mcp-requirements.txt
          "$RUNNER_TEMP/zefacture-mcp/bin/python" django/tests/check_mcp.py

  publication:
    name: Fichiers et historique publics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Vérifier le contrôle de publication
        run: python -m unittest discover -s .github/tests
      - name: Contrôler les fichiers et les guides suivis
        run: python .github/scripts/check_publication.py

  tests:
    name: Tests Python ${{ matrix.python }} et PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: zefacture
          POSTGRES_PASSWORD: ci-synthetic-password
          POSTGRES_DB: zefacture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zefacture"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: django
    env:
      ZEFACTURE_ENV_FILE: /tmp/no-private-environment
      APP_ENV: testing
      DEBUG: '0'
      DATABASE_URL: postgresql://zefacture:ci-synthetic-password@127.0.0.1:5432/zefacture
      DJANGO_SECRET_KEY: ci-synthetic-key-for-disposable-tests-only-01234567890123456789
      DATA_DIR: /tmp/zefacture-ci-data
      APP_URL: http://127.0.0.1:8091
      MAIL_TRANSPORT: outbox
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 'django/requirements.txt'
      - name: Bibliothèques PDF et OCR
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core poppler-utils tesseract-ocr tesseract-ocr-fra openssl
      - run: python -m pip install -r requirements.txt -r ../.github/requirements-ci.txt
      - name: Migrations et fichiers statiques
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          python manage.py prepare_storage
      - name: Contrôles Django de production
        run: python manage.py check --deploy --fail-level WARNING
        env:
          APP_ENV: production
          APP_URL: https://zefacture.example.test
          ALLOWED_HOSTS: zefacture.example.test,127.0.0.1,localhost
          TRUST_PROXY: '1'
          PROXY_SHARED_SECRET: ci-synthetic-proxy-secret-not-used-outside-this-run
          SECURE_HSTS_INCLUDE_SUBDOMAINS: '1'
          SECURE_HSTS_PRELOAD: '1'
      - name: Tests de non-régression et couverture
        run: |
          mkdir -p test-results
          coverage run --source=core,config manage.py test tests --noinput
          coverage report
          coverage xml -o test-results/coverage.xml
      - name: Résultat de couverture
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-python-${{ matrix.python }}
          path: django/test-results/coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Docker, navigateur, exports et restauration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: django/tests/browser/package-lock.json
      - name: Installer les dépendances JavaScript
        run: npm ci --prefix django/tests/browser
      - name: Installer Chromium
        timeout-minutes: 8
        uses: ./.github/actions/install-chromium
        with:
          working-directory: django/tests/browser
      - name: Parcours complets sur données fictives
        run: bash django/tools/ci_e2e.sh
        env:
          CI: 'true'
      - name: Captures et preuves de validation fictives
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: browser-and-recovery
          path: |
            django/test-results/browser-*/*.png
            django/test-results/browser-*/report.json
            django/test-results/ci-recovery.json
            django/test-results/ci-containers.log
          retention-days: 7
          if-no-files-found: ignore

  package:
    name: Archive des sources publiques
    needs: [common, publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Archiver le commit vérifié et calculer son empreinte
        run: |
          output="$RUNNER_TEMP/zefacture-source"
          mkdir -p "$output"
          git archive --format=tar.gz --prefix=zefacture/ --output="$output/zefacture-source.tar.gz" HEAD
          cd "$output"
          sha256sum zefacture-source.tar.gz > SHA256SUMS
      - name: Conserver l’archive et son empreinte
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zefacture-source
          path: ${{ runner.temp }}/zefacture-source/
          if-no-files-found: error
          retention-days: 7

  ready:
    name: CI validée
    if: always()
    needs: [common, quality, publication, tests, integration, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Contrôles requis
        env:
          COMMON_RESULT: ${{ needs.common.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PUBLICATION_RESULT: ${{ needs.publication.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          for result in "$COMMON_RESULT" "$QUALITY_RESULT" "$PUBLICATION_RESULT" "$TESTS_RESULT" "$INTEGRATION_RESULT" "$PACKAGE_RESULT"; do
            test "$result" = success || exit 1
          done
