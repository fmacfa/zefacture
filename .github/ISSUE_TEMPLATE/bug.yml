name: Signaler un bug
description: Décrire un problème reproductible avec des données fictives.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Pour une vulnérabilité, utiliser Security → Report a vulnerability. Ne joindre aucun secret, donnée client, facture réelle, capture privée ou sauvegarde."
  - type: input
    id: version
    attributes: {label: Version ou commit, placeholder: 0.1.0-rc.1}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Étapes de reproduction, description: Utiliser uniquement des valeurs fictives.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Résultat attendu et résultat obtenu}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Environnement, description: Système et mode Docker/natif ; aucun contenu de fichier .env.}
  - type: checkboxes
    id: privacy
    attributes:
      label: Vérification des informations partagées
      options:
        - label: Les exemples sont fictifs et ne contiennent ni secret ni donnée client.
          required: true
