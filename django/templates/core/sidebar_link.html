<a href="{{ route }}"{% if route == active_route %} class="active" aria-current="page"{% endif %}>
  <svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
    {% if icon == 'dashboard' %}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
    {% elif icon == 'quote' %}<path d="M13 20H5V4h10l4 4v4M15 4v5h4M8 9h3m-3 4h5m3 4 4-4 2 2-4 4-3 1z"/>
    {% elif icon == 'invoice' %}<path d="M5 3h14v18l-3.5-2-3.5 2-3.5-2L5 21zM8 7h8m-8 4h8m-8 4h4"/>
    {% elif icon == 'refund' %}<path d="M7 12h9a4 4 0 0 1 0 8h-3M7 12l4 4m-4-4 4-4M4 8V4h12l4 4"/>
    {% elif icon == 'clients' %}<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v2m1-15a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/>
    {% elif icon == 'bank' %}<path d="m3 9 9-6 9 6M3 10h18M5 19h14M3 21h18M7 12v5m5-5v5m5-5v5"/>
    {% elif icon == 'transfer' %}<path d="M3 8h16l-4-4m6 12H5l4 4m10-12-4 4M5 16l4-4"/>
    {% elif icon == 'crm' %}<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="10" r="1.5"/><path d="M6 15h4m4-5h4m-4 5h4"/>
    {% elif icon == 'inventory' %}<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zm-8 4.5L12 12l8-4.5M12 12v9M8 5.25l8 4.5v3"/>
    {% elif icon == 'inbox' %}<path d="M4 14 7 5h10l3 9v5H4zm0 0h5l1 2h4l1-2h5M12 7v5m-2-2 2 2 2-2"/>
    {% elif icon == 'import' %}<path d="M5 15v5h14v-5m-7 2V4m-5 5 5-5 5 5"/>
    {% elif icon == 'expense' %}<rect x="4" y="6" width="16" height="15" rx="2"/><path d="M8 6V4h8v2M8 11h8m-8 4h5"/>
    {% elif icon == 'finance' %}<path d="M3 9h18L12 4zM4 20h16M7 12v5m5-5v5m5-5v5"/>
    {% elif icon == 'reports' %}<path d="M4 4v16h16M8 16v-4m4 4V8m4 8v-6m4 6V5"/>
    {% elif icon == 'company' %}<path d="M4 21h16M6 21V4h10v17m0-12h3v12M9 8h3m-3 4h3m-3 4h3"/>
    {% elif icon == 'branding' %}<path d="M14 5l5 5M4 17l2-5L17 2l5 5L11 18zm0 0-1 4 4-1"/>
    {% elif icon == 'mail' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>
    {% elif icon == 'api' %}<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/>
    {% elif icon == 'security' %}<path d="m12 3 8 4v5a10 10 0 0 1-8 9 10 10 0 0 1-8-9V7zm-4 9 3 3 5-5"/>
    {% elif icon == 'account' %}<circle cx="12" cy="8" r="4"/><path d="M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/>
    {% endif %}
  </svg>
  <span>{{ label }}</span>
</a>
