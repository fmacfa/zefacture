{% extends "core/base.html" %}{% block content %}<h1>Mes entreprises</h1><div class="grid two">{% for c in companies %}<form class="card" method="post" action="/app/entreprises/{{ c.company_uid }}/selectionner">{% csrf_token %}<h2>{{ c.legal_name }}</h2><p>{{ c.siren|default:"SIREN non renseigné" }}</p><button class="secondary">Ouvrir cette entreprise</button></form>{% endfor %}</div><form class="card narrow stack" method="post" action="/app/entreprises/creer">{% csrf_token %}<h2>Nouvelle entreprise</h2><label>Raison sociale<input name="legal_name" required></label><button>Créer l'entreprise</button></form>{% endblock %}
