{% extends "core/base.html" %}{% block content %}<div class="page-head"><h1>Préférences d’affichage</h1><a class="button secondary" href="/app/compte">Mon compte</a></div><form method="post" class="card stack narrow">{% csrf_token %}<p>Ces préférences suivent votre compte dans toutes vos entreprises, sur ordinateur, tablette et téléphone.</p><label>Thème<select name="theme" aria-label="Thème"><option value="system" {% if preferences.theme == 'system' %}selected{% endif %}>Suivre le système</option><option value="light" {% if preferences.theme == 'light' %}selected{% endif %}>Clair</option><option value="dark" {% if preferences.theme == 'dark' %}selected{% endif %}>Sombre</option></select></label><label>Densité des tableaux<select name="density" aria-label="Densité des tableaux"><option value="comfortable" {% if preferences.density == 'comfortable' %}selected{% endif %}>Confortable</option><option value="compact" {% if preferences.density == 'compact' %}selected{% endif %}>Compacte</option></select></label><button>Enregistrer les préférences</button></form>{% endblock %}
