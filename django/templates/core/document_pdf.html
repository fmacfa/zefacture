<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>{{ document.number }}</title><meta name="author" content="{{ document.seller.name }}"><meta name="description" content="{% if is_quote %}Devis{% else %}Facture{% endif %} {{ document.number }}">
<style>
@page{size:A4;margin:17mm 15mm 20mm;@bottom-left{content:string(document-number);font:8pt sans-serif;color:#63706a}@bottom-right{content:counter(page) " / " counter(pages);font:8pt sans-serif;color:#63706a}}
body{font-family:sans-serif;font-size:9pt;line-height:1.45;color:#1d302d}h1{font-size:21pt;line-height:1.2;margin:0 0 2mm}h2{font-size:9pt;margin:0 0 2mm;color:{{ brand_color }}}.masthead{border-bottom:3px solid {{ brand_color }};padding-bottom:6mm;margin-bottom:7mm}.brand{font-size:16pt;font-weight:700;color:{{ brand_color }}}.number{string-set:document-number content(text);font-size:11pt;font-weight:600;overflow-wrap:anywhere}.parties{width:100%;table-layout:fixed;margin:7mm 0}.parties td{vertical-align:top;width:50%;padding-right:5mm;overflow-wrap:anywhere}.details{background:#e8eee5;padding:4mm;margin:5mm 0}.lines{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8pt}.lines th{background:{{ brand_color }};color:white;text-align:left;padding:3mm 2mm;font-weight:600}.lines td{border-bottom:1px solid #e0e5dc;padding:3mm 2mm;vertical-align:top;overflow-wrap:anywhere}.lines .num{text-align:right}.lines tr{break-inside:avoid}.lines thead{display:table-header-group}.totals{width:52%;margin:6mm 0 0 auto;break-inside:avoid}.totals td{padding:1.4mm 2mm}.totals td:last-child{text-align:right;white-space:nowrap}.grand{background:#e8eee5;font-weight:700;font-size:11pt}.notes{margin-top:6mm;font-size:8pt;color:#63706a;overflow-wrap:anywhere}.draft{color:#a47324;font-size:8pt}.muted{color:#63706a}small{font-size:7pt}
.company-logo{max-width:45mm;max-height:22mm;margin-bottom:3mm}.compact .masthead{padding-bottom:3mm;margin-bottom:4mm}.compact .parties{margin:4mm 0}.compact .lines td{padding:2mm}
</style></head><body class="{{ branding.document_layout }}">
{% include "core/document_sheet.html" %}
</body></html>
