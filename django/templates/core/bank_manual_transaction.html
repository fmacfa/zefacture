<form class="card form-grid" method="post" data-manual-bank id="saisie" action="/app/finances/transactions">{% csrf_token %}<h2 class="full">{% if new_expense %}Saisir une dépense hors facture{% else %}Nouvelle transaction{% endif %}</h2>
  <label>Date<input name="transaction_date" type="date" value="{{ today }}" required></label><label>Libellé<input name="label" required></label>
  <label>Montant<input name="amount" type="number" step="0.01" min="0.01" required></label><label>Sens<select name="direction"><option value="incoming">Encaissement</option><option value="outgoing"{% if new_expense %} selected{% endif %}>Décaissement</option></select></label>
  <label>Compte<select name="account_uid"><option value="">Sans compte (EUR)</option>{% for a in accounts %}<option value="{{ a.account_uid }}"{% if request.GET.compte == a.account_uid %} selected{% endif %}>{{ a.name }} · {{ a.currency_code }}</option>{% endfor %}</select></label>
  <label>Catégorie hors facture<select name="standalone_category"><option value="">À traiter ultérieurement</option><optgroup label="Décaissements" data-direction="outgoing">{% for code,label in outgoing_categories.items %}<option value="{{ code }}"{% if new_expense == code %} selected{% endif %}>{{ label }}</option>{% endfor %}</optgroup><optgroup label="Encaissements" data-direction="incoming">{% for code,label in incoming_categories.items %}<option value="{{ code }}"{% if new_expense == code %} selected{% endif %}>{{ label }}</option>{% endfor %}</optgroup></select></label>
  <label class="full">Motif ou bénéficiaire (facultatif)<input name="classification_note" maxlength="500"></label>
  <div class="form-actions"><button>Enregistrer</button></div>
</form>
