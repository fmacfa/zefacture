<label>Nom du contact<input name="name" value="{{ initial_contact.name }}" maxlength="200" autocomplete="off" required></label>
<label>Fonction (facultatif)<input name="position" value="{{ initial_contact.position }}" maxlength="200"></label>
<label>Adresse email (facultatif)<input name="email" value="{{ initial_contact.email }}" type="email" maxlength="254"></label>
<label>Téléphone (facultatif)<input name="phone" value="{{ initial_contact.phone }}" type="tel" maxlength="80"></label>
