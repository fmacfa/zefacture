{% extends "core/base.html" %}{% block content %}<div class="page-head"><h1>Mon compte</h1><a class="button secondary" href="/app/compte/securite">Sécurité et double authentification</a></div><form method="post" class="card form-grid">{% csrf_token %}<label>Nom<input name="name" value="{{ user.name }}" required></label><label>Email<input name="email" type="email" value="{{ user.email }}" required></label><label>Mot de passe actuel<input name="current_password" type="password" required autocomplete="current-password"></label>{% if has_mfa %}<label>Code d’authentification ou de secours<input name="code" required autocomplete="one-time-code" maxlength="32"></label>{% else %}<div></div>{% endif %}<label>Nouveau mot de passe<input name="password" type="password" minlength="10" autocomplete="new-password"></label><label>Confirmer<input name="password_confirmation" type="password" autocomplete="new-password"></label><div class="form-actions"><button>Enregistrer</button></div></form><p><a href="/app/compte/affichage">Préférences d’affichage : thème et densité</a></p>{% endblock %}
