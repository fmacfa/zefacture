<label>Intitulé<input name="title" value="{{ item.title }}" maxlength="240" required></label><label>Étape<select aria-label="Étape" name="stage">{% for value,label in stages %}<option value="{{ value }}" {% if value == item.stage %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Montant<input name="amount" type="number" min="0" step="0.01" value="{{ item.amount|stringformat:'s'|default:'0' }}" required></label><label>Devise<select aria-label="Devise" name="currency_code"><option value="{{ item.currency_code|default:'EUR' }}">{{ item.currency_code|default:'EUR' }}</option><option>EUR</option><option>USD</option><option>GBP</option><option>CHF</option><option>CAD</option><option>JPY</option><option>SEK</option><option>NOK</option><option>DKK</option><option>PLN</option></select></label><label>Clôture prévue<input name="expected_close" type="date" value="{{ item.expected_close|date:'Y-m-d' }}"></label><label>Responsable<select aria-label="Responsable" name="assigned_to_user_uid"><option value="">Non attribuée</option>{% for member in members %}<option value="{{ member.user_uid }}" {% if item.assigned_to_user_uid == member.user_uid %}selected{% endif %}>{{ member.name }}</option>{% endfor %}</select></label><label class="full">Notes<textarea name="notes" rows="3">{{ item.notes }}</textarea></label>
