<select name="status" aria-label="Statut">
  <option value="">Tous les statuts</option>
  <option value="draft"{% if request.GET.status == "draft" %} selected{% endif %}>Brouillons</option>
  <option value="sent"{% if request.GET.status == "sent" %} selected{% endif %}>Envoyés</option>
  <option value="received"{% if request.GET.status == "received" %} selected{% endif %}>Reçus</option>
  {% if section == "reception" or section == "devis" %}
    <option value="refused"{% if request.GET.status == "refused" %} selected{% endif %}>Refusés</option>
  {% endif %}
  {% if section == "reception" %}
    <option value="disputed"{% if request.GET.status == "disputed" %} selected{% endif %}>En litige</option>
  {% endif %}
  <option value="accepted"{% if request.GET.status == "accepted" %} selected{% endif %}>Acceptés</option>
  <option value="paid"{% if request.GET.status == "paid" %} selected{% endif %}>Payés</option>
  <option value="cancelled"{% if request.GET.status == "cancelled" %} selected{% endif %}>Annulés</option>
  <option value="simulated"{% if request.GET.status == "simulated" %} selected{% endif %}>Simulations</option>
</select>
